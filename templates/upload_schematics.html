<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Schematics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* BASE */
    html {
      font-size: 16.5px;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #e9eef5, #f6f8fb);
    }

    /* PAGE GRID */
    .page {
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    /* SIDEBAR */
    .sidebar {
      background: linear-gradient(180deg, #0b5ed7, #083d9c, #512da8);
      color: #fff;
      padding: 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 12px rgba(0,0,0,0.15);
    }

    .sidebar h4 {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 32px;
    }

    .sidebar span {
      font-size: 1.05rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    /* MAIN */
    .main {
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .topbar {
      height: 64px;
      background: linear-gradient(90deg, #ffffff, #f1f5ff);
      border-bottom: 2px solid #dee2e6;
      display: flex;
      align-items: center;
      padding: 0 32px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #0b5ed7;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* CONTENT */
    .content {
      flex: 1;
      padding: 24px 32px;
      overflow: hidden;
    }

    .content-panel {
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 22px rgba(0,0,0,0.08);
      border: 1px solid #e3e8f0;
    }

    .content-panel h5 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    /* TABLE */
    .table-wrapper {
      flex: 1;
      overflow-y: auto;
    }

    table {
      margin-bottom: 0;
    }

    th {
      width: 25%;
      font-size: 1.05rem;
      font-weight: 600;
      background: linear-gradient(90deg, #e3f2fd, #ede7f6) !important;
      color: #0d47a1;
      vertical-align: middle;
    }

    td {
      font-size: 1.05rem;
    }

    /* FORM CONTROLS */
    .form-control,
    .form-select,
    .input-group-text {
      font-size: 1.05rem;
      padding: 0.55rem 0.75rem;
    }

    /* FOOTER BUTTONS */
    .form-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 2px solid #e3f2fd;
      display: flex;
      justify-content: flex-end;
      gap: 14px;
    }

    .btn {
      font-size: 1.05rem;
      padding: 0.55rem 1.35rem;
    }

    .btn-primary {
      background: linear-gradient(90deg, #1976d2, #7b1fa2);
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h4>🔧 Hardware Portal</h4>
    <span>
      Design Repository<br>
      Schematics Upload<br>
      Power Electronics<br>
      Automotive Systems
    </span>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOP BAR -->
    <div class="topbar">
      Upload Schematics
    </div>

    <!-- CONTENT -->
    <div class="content">

      <form action="/upload_schematics" method="POST" enctype="multipart/form-data"
            class="content-panel">

        <h5 class="mb-3 text-primary">Schematic Details</h5>

        <!-- TABLE -->
        <div class="table-wrapper mb-3">
          <table class="table table-bordered align-middle w-100 h-100">
            <tbody>

              <tr>
                <th>Title</th>
                <td>
                  <input type="text" name="title" class="form-control" required>
                </td>
              </tr>

              <tr>
                <th>Description</th>
                <td>
                  <textarea name="description" rows="4"
                            class="form-control"
                            placeholder="Brief schematic description, application, ratings"></textarea>
                </td>
              </tr>

              <tr>
                <th>Input Voltage</th>
                <td>
                  <select name="input_voltage" class="form-select" required>
                    <option value="">Select voltage</option>
                    <option>1.5 V</option>
                    <option>3.3 V</option>
                    <option>5 V</option>
                    <option>9 V</option>
                    <option>12 V</option>
                    <option>15 V</option>
                    <option>18 V</option>
                    <option>24 V</option>
                    <option>48 V</option>
                    <option>110 V</option>
                    <option>120 V</option>
                    <option>208 V</option>
                    <option>220 V</option>
                    <option>240 V</option>
                    <option>400 V</option>
                    <option>415 V</option>
                    <option>480 V</option>
                  </select>
                </td>
              </tr>

              <tr>
                <th>Output Current</th>
                <td>
                  <div class="input-group">
                    <input type="number" step="0.1" name="output_current"
                           class="form-control" required>
                    <span class="input-group-text">A</span>
                  </div>
                </td>
              </tr>

              <tr>
                <th>Schematic File</th>
                <td>
                  <input type="file" name="file" class="form-control" required>
                </td>
              </tr>

            </tbody>
          </table>
        </div>

        <!-- FOOTER -->
        <div class="form-footer">
          <a href="{{ url_for('schematics_home') }}" class="btn btn-outline-secondary">
            Cancel
          </a>
          <button type="submit" class="btn btn-primary">
            Upload Schematic
          </button>
        </div>

      </form>

    </div>

  </div>

</div>

</body>
</html>
