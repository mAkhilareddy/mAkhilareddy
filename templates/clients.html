<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clients</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #007bff;
            color: white;
            font-size: 16px;
        }
        tr:hover {
            background: #f1f1f1;
        }
        .active {
            color: green;
            font-weight: bold;
        }
        .inactive {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Client Management</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Client Name</th>
                <th>vertical</th>
                <th>Projects</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
            <tr>
                <td>{{ client.id }}</td>
                <td>{{ client.name }}</td>
                <td>{{ client.vertical }}</td>
                <td>{{ client.projects }}</td>
                <td class="{{ 'active' if client.status == 'Active' else 'inactive' }}">{{ client.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
