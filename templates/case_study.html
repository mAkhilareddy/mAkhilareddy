<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Case Study Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5 text-center">
    <h2 class="mb-4">📘 Case Study Portal</h2>
    <p class="text-muted mb-5">Manage all your case studies — upload new ones or explore existing work.</p>

    <div class="row justify-content-center">
      <!-- Upload Case Study -->
      <div class="col-md-4 mb-4">
        <a href="{{ url_for('case_upload') }}" class="text-decoration-none text-dark">
          <div class="card text-center p-4 shadow-sm hover-shadow rounded-4">
            <h4>⬆️ Upload Case Study</h4>
            <p>Submit and store new case study documents securely.</p>
          </div>
        </a>
      </div>

      <!-- Search Case Study -->
      <div class="col-md-4 mb-4">
        <a href="{{ url_for('case_search') }}" class="text-decoration-none text-dark">
          <div class="card text-center p-4 shadow-sm hover-shadow rounded-4">
            <h4>🔍 Search Case Studies</h4>
            <p>Browse and explore uploaded case studies easily.</p>
          </div>
        </a>
      </div>
    </div>

    <div class="mt-5">
      <a href="{{ url_for('main_home') }}" class="btn btn-secondary">⬅ Back to Main</a>
    </div>
  </div>

  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      transition: all 0.3s ease;
      border: none;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
  </style>
</body>
</html>
