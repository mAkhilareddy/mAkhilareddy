<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings – Proposal Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin: 0;
    }

    .settings-card {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 2rem 2.5rem;
      border-radius: 15px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 600px;
      animation: fadeSlide 0.6s ease-out;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      color: #fdbb2d;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    label {
      color: #fdbb2d;
    }

    .form-control {
      background-color: #fff;
      color: #000;
      border-radius: 8px;
    }

    .form-control:focus {
      border-color: #fdbb2d;
      box-shadow: 0 0 0 0.2rem rgba(253, 187, 45, 0.25);
    }

    .btn-primary {
      background-color: #fdbb2d;
      border-color: #fdbb2d;
      color: #000;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #ffc93b;
      transform: scale(1.02);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid #fdbb2d;
      color: #fdbb2d;
    }

    .btn-secondary:hover {
      background-color: #fdbb2d;
      color: #000;
    }

    @media (max-width: 576px) {
      .settings-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="settings-card">
    <h1>Settings</h1>
    <p class="text-light text-center mb-4">Update your profile and change your password.</p>

    <form method="POST">
      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Enter new username">
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter new email">
      </div>

      <hr class="text-light">

      <h5 class="text-warning mb-3">Change Password</h5>

      <!-- Current Password -->
      <div class="mb-3">
        <label for="current_password" class="form-label">Current Password</label>
        <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Enter current password">
      </div>

      <!-- New Password -->
      <div class="mb-3">
        <label for="new_password" class="form-label">New Password</label>
        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password">
      </div>

      <!-- Confirm New Password -->
      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm new password">
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100">Save Changes</button>
    </form>

    <div class="text-center">
      <a href="{{ url_for('home') }}" class="btn btn-secondary mt-4">Back to Home</a>
    </div>
  </div>

</body>
</html>
