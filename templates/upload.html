<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Proposal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0e0f0f, #868282);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #fff;
    }
    .navbar {
      background: rgba(0, 0, 0, 0.7);
    }
    .container {
      flex: 1;
      margin-top: 2rem;
    }
    .form-card {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 15px;
      padding: 2rem;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.9);
      border: none;
    }
    .btn-custom {
      border-radius: 30px;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      margin-top: 1rem;
    }
    footer {
      background: rgba(0, 0, 0, 0.8);
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Proposal Manager</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="{{ url_for('upload') }}">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('search') }}">Search</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Upload Form -->
  <div class="container">
    <h2 class="mb-4 text-center">Upload a Proposal</h2>

    <div class="form-card">
      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="title" class="form-label">Proposal Title</label>
          <input type="text" class="form-control" id="title" name="title" required>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <label for="standard" class="form-label"> Lifecycle Standard</label>
            <select name="standard" class="form-select" required>
            <option value="">Select standarad</option>
              <option value="npi">NPI/NPD</option>
              <option value="vave">VAVE</option>
                <option value="compliance">Compliance</option>
                  <option value="reengineering">Re-engineering</option>
                    <option value="obsolescence">obsolescence</option>
                    <option value="IEEE 1547">IEEE 1547</option>

                    </select>
              

          </div>
          <div class="col-md-6">
            <label for="industry" class="form-label">Industry</label>
            <select name="industry" class="form-select" required>
              <option value="">Select industry</option>
              <option value="automotive"> Automotive</option>
              <option value="mechanical">Mechanical</option>
              <option value="powerelectronics">powerElectronics</option>
              <option value="electrical">Electrical</option>
              <option value="semiconductor">Semiconductor</option>
              </select>
          </div>
        </div>

        <div class="mb-3 mt-3">
          <label for="file" class="form-label">Upload File</label>
          <input type="file" class="form-control" id="file" name="file" required>
        </div>

        <button type="submit" class="btn btn-warning btn-custom">Upload Proposal</button>
      </form>
    </div>
  </div>
  
  <!-- Footer -->
  <footer>
    <p>&copy; {{ year }} Proposal Manager. All rights reserved.</p>
  </footer>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
